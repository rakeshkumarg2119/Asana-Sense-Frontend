<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#05140d" />
    </radialGradient>
    <linearGradient id="goldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="auraGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer Sacred Geometry Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGreen)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGreen)" stroke-width="2.5" stroke-opacity="0.8" />
  
  <!-- Biomechanical Alignment Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="86" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="426" x2="256" y2="456" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  <line x1="56" y1="256" x2="86" y2="256" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  <line x1="426" y1="256" x2="456" y2="256" stroke="#34d399" stroke-width="3" stroke-linecap="round" />

  <!-- Lotus & Yogi Posture Central Artwork -->
  <g transform="translate(256, 256) scale(0.92)" filter="url(#glow)">
    <!-- Aura Rays -->
    <circle cx="0" cy="-60" r="32" fill="url(#auraGold)" opacity="0.9" />
    <circle cx="0" cy="-60" r="42" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-dasharray="4 4" />

    <!-- Meditating Yogi Crown & Spine Alignment -->
    <line x1="0" y1="-25" x2="0" y2="90" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" />

    <!-- Lotus Petals / Yoga Arms Arch -->
    <path d="M 0 -20 C -45 10 -90 50 -105 85 C -90 105 -40 110 0 110 C 40 110 90 105 105 85 C 90 50 45 10 0 -20 Z" 
          fill="url(#goldGreen)" opacity="0.95" />
    
    <path d="M 0 5 C -35 25 -70 60 -75 90 C -60 100 -30 105 0 105 C 30 105 60 100 75 90 C 70 60 35 25 0 5 Z" 
          fill="#022c22" opacity="0.6" />

    <!-- Upper Lotus Wings / Upward Energy -->
    <path d="M 0 -20 C -30 -60 -70 -70 -90 -45 C -85 -15 -45 10 0 15 C 45 10 85 -15 90 -45 C 70 -70 30 -60 0 -20 Z" 
          fill="url(#goldGreen)" opacity="0.85" />

    <!-- Inner Core Heart Chakra Energy Star -->
    <circle cx="0" cy="25" r="12" fill="#fef08a" />
    <circle cx="0" cy="25" r="18" fill="none" stroke="#6ee7b7" stroke-width="2.5" />
    
    <!-- Joint Keypoints -->
    <circle cx="-55" cy="55" r="6" fill="#34d399" />
    <circle cx="55" cy="55" r="6" fill="#34d399" />
    <circle cx="-85" cy="85" r="5" fill="#6ee7b7" />
    <circle cx="85" cy="85" r="5" fill="#6ee7b7" />
  </g>

  <!-- Title Monogram Minimal Accent -->
  <text x="256" y="475" text-anchor="middle" font-family="'Space Mono', monospace, sans-serif" font-size="22" font-weight="bold" fill="#a7f3d0" letter-spacing="6">ASANA SENSE</text>
</svg>
