<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#05140d" />
    </radialGradient>
    <linearGradient id="goldGreenMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="auraGoldMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background Canvas for OS Masking -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />
  
  <!-- Outer Sacred Geometry Ring in Safe Zone -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#goldGreenMask)" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGreenMask)" stroke-width="2" stroke-opacity="0.8" />

  <!-- Lotus & Yogi Posture in 80% Safe Zone -->
  <g transform="translate(256, 256) scale(0.78)" filter="url(#glowMask)">
    <circle cx="0" cy="-60" r="32" fill="url(#auraGoldMask)" opacity="0.9" />
    <circle cx="0" cy="-60" r="42" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-dasharray="4 4" />

    <line x1="0" y1="-25" x2="0" y2="90" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" />

    <path d="M 0 -20 C -45 10 -90 50 -105 85 C -90 105 -40 110 0 110 C 40 110 90 105 105 85 C 90 50 45 10 0 -20 Z" 
          fill="url(#goldGreenMask)" opacity="0.95" />
    
    <path d="M 0 5 C -35 25 -70 60 -75 90 C -60 100 -30 105 0 105 C 30 105 60 100 75 90 C 70 60 35 25 0 5 Z" 
          fill="#022c22" opacity="0.6" />

    <path d="M 0 -20 C -30 -60 -70 -70 -90 -45 C -85 -15 -45 10 0 15 C 45 10 85 -15 90 -45 C 70 -70 30 -60 0 -20 Z" 
          fill="url(#goldGreenMask)" opacity="0.85" />

    <circle cx="0" cy="25" r="12" fill="#fef08a" />
    <circle cx="0" cy="25" r="18" fill="none" stroke="#6ee7b7" stroke-width="2.5" />
    
    <circle cx="-55" cy="55" r="6" fill="#34d399" />
    <circle cx="55" cy="55" r="6" fill="#34d399" />
    <circle cx="-85" cy="85" r="5" fill="#6ee7b7" />
    <circle cx="85" cy="85" r="5" fill="#6ee7b7" />
  </g>
</svg>
